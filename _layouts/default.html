<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
</head>
<body>
  {% assign ordered_sections = site.sections | sort: "order" %}
  <main>
    {% for section in ordered_sections %}
    <section id="{{ section.nav_id }}">
      <h2>{{ section.title }}</h2>
      {{ section.content }}
    </section>
    {% endfor %}
  </main>
</body>
</html>
